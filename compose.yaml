services:
  app:
    build: .
    read_only: true
    mem_limit: 256m
    cpus: 1.0

    ports: 
      - "127.0.0.1:${APP_PORT}:8000"

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    environment:
      GREETING: "${GREETING}"
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    
  redis:
    image: redis:7.4-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - always

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    volumes:
      - redis-data:/data
    

volumes:
  redis-data:
